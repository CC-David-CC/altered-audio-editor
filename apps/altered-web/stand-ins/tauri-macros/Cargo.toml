# Playground's browser build of Altered Audio Editor (patches/audition.yaml in github.com/daijro/openplayground):
# `#[tauri::command]`, `generate_handler!` and `generate_context!` for the stand-in `tauri` crate beside it.
[package]
name = "playground-tauri-macros"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
